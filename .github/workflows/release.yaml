name: Agent Core Release

on:
  push:
    tags:
      - 'agent-core-[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to publish
        required: true
        type: string

permissions:
  contents: write
  packages: write

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    uses: ShawnDen-coder/repo-scaffold/.github/workflows/reusable-node-release.yaml@0.35.0
    with:
      tag: ${{ inputs.tag || github.ref_name }}
      build-command: >-
        pnpm format:check &&
        pnpm -r run typecheck &&
        pnpm -r run test &&
        pnpm --filter agent-core build &&
        node -e "const fs=require('node:fs');fs.cpSync('packages/agent-core/dist','dist',{recursive:true});fs.copyFileSync('packages/agent-core/package.json','package.json')"
      publish-npm: false
      publish-gpr: true
      github-package-name: '@shawnden-coder/agent-core'
