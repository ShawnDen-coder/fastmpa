name: Package Release

on:
  push:
    tags:
      - 'agent-*-*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to publish
        required: true
        type: string

permissions:
  contents: write
  packages: write

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    uses: ./.github/workflows/reusable-node-release.yaml
    with:
      tag: ${{ inputs.tag || github.ref_name }}
      build-command: just release-check "${{ inputs.tag || github.ref_name }}"
      publish-npm: false
      publish-gpr: true
