name: Agent Core Release

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to build
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref_name }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: latest

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm format:check

      - name: Type check
        run: pnpm -r run typecheck

      - name: Test
        run: pnpm -r run test

      - name: Build agent-core
        run: pnpm --filter agent-core build

      - name: Pack agent-core
        run: pnpm --filter agent-core pack --pack-destination "${{ github.workspace }}/artifacts"

      - name: Upload package artifact
        uses: actions/upload-artifact@v7
        with:
          name: agent-core-${{ inputs.tag || github.ref_name }}
          path: artifacts/*.tgz
          if-no-files-found: error

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          name: Release ${{ inputs.tag || github.ref_name }}
          files: artifacts/*.tgz
          generate_release_notes: true
