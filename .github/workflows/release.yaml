name: Package Release

on:
  push:
    tags:
      - 'agent-*-*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to publish
        required: true
        type: string

permissions:
  contents: write
  packages: write

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    uses: ShawnDen-coder/repo-scaffold/.github/workflows/reusable-node-release.yaml@0.35.0
    with:
      tag: ${{ inputs.tag || github.ref_name }}
      build-command: >-
        pnpm check &&
        pnpm -r --if-present run build &&
        pnpm -r --if-present run typecheck &&
        pnpm -r --if-present run test &&
        node scripts/prepare-release-package.mjs "${{ inputs.tag || github.ref_name }}"
      publish-npm: false
      publish-gpr: true
