name: Package Release

on:
  push:
    tags:
      - '**-[0-9]+.[0-9]+.[0-9]+'
      - '[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to publish
        required: true
        type: string

permissions:
  contents: write
  packages: write

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  package-release:
    if: contains(inputs.tag || github.ref_name, '-')
    uses: ./.github/workflows/reusable-node-release.yaml
    with:
      tag: ${{ inputs.tag || github.ref_name }}
      build-command: just release-check "${{ inputs.tag || github.ref_name }}"
      pack-command: ''
      publish-npm: false
      publish-gpr: true

  monorepo-release:
    if: "!contains(inputs.tag || github.ref_name, '-')"
    uses: ./.github/workflows/reusable-node-release.yaml
    with:
      tag: ${{ inputs.tag || github.ref_name }}
      build-command: just release-monorepo "${{ inputs.tag || github.ref_name }}"
      pack-command: ''
      publish-npm: false
      publish-gpr: false
