name: Version Bump

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: version-bump-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version-bump:
    uses: ShawnDen-coder/repo-scaffold/.github/workflows/reusable-version-bump.yaml@0.35.0
    with:
      node-version: '22'
      pnpm-version: latest
