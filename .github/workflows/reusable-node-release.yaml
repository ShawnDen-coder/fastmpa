name: Reusable Node Release

on:
  workflow_call:
    inputs:
      tag:
        description: Existing release tag
        required: true
        type: string
      build-command:
        description: Command used to build the package
        required: false
        type: string
        default: pnpm build
      publish-npm:
        description: Publish the package to npm
        required: false
        type: boolean
        default: false
      pack-command:
        description: Optional command used to create the release artifact
        required: false
        type: string
        default: "npm pack --pack-destination release"
      publish-gpr:
        description: Publish the package to GitHub Packages
        required: false
        type: boolean
        default: false
    secrets:
      NPM_TOKEN:
        required: false
      PERSONAL_ACCESS_TOKEN:
        required: false

permissions:
  contents: write
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}
      - uses: pnpm/action-setup@v6
        with:
          version: 11.24.0
      - uses: extractions/setup-just@v4
        with:
          just-version: "1.58.0"
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build
        run: ${{ inputs.build-command }}
      - name: Pack release artifact
        if: inputs.pack-command != ''
        run: mkdir -p release && ${{ inputs.pack-command }}
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: |
            release/
            dist/
            package.json
          if-no-files-found: error

  publish-npm:
    if: inputs.publish-npm
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: .
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          registry-url: https://registry.npmjs.org
      - name: Publish to npm
        run: npm publish ./release/*.tgz --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  publish-gpr:
    if: inputs.publish-gpr
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: .
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          registry-url: https://npm.pkg.github.com
      - name: Publish to GitHub Packages
        run: npm publish ./release/*.tgz --access public --registry https://npm.pkg.github.com
        env:
          NODE_AUTH_TOKEN: ${{ github.token }}

  release:
    if: >-
      always() &&
      needs.build.result == 'success' &&
      (needs.publish-npm.result == 'success' || needs.publish-npm.result == 'skipped') &&
      (needs.publish-gpr.result == 'success' || needs.publish-gpr.result == 'skipped')
    needs: [build, publish-npm, publish-gpr]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: .
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ inputs.tag }}
          name: Release ${{ inputs.tag }}
          files: release/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
