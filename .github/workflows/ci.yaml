name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    uses: ShawnDen-coder/repo-scaffold/.github/workflows/reusable-node-ci.yaml@0.35.0
    with:
      node-version: '22'
      lint-command: pnpm format:check
      build-command: pnpm -r run build
      test-command: pnpm -r run test
