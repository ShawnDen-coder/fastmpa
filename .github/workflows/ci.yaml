name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    uses: ./.github/workflows/reusable-node-ci.yaml
    with:
      node-version: '22'
      lint-command: just check
      build-command: just build && just typecheck
      test-command: just test && just desktop-smoke
